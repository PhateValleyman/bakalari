# Build APK of BakalariGuard for Android 14 (API 34), arm64-v8a (aarch64) only.
#
# The upstream GitHub project (https://github.com/PhateValleyman/bakalari) does
# not compile as-is, so this job patches the working tree before building
# (master stays a byte-identical mirror of GitHub):
#   1. compileSdk/targetSdk 35 -> 34, androidx.core 1.15.0 -> 1.13.1
#      (1.15.0 needs SDK 35; 1.13.1 is the last version for compileSdk 34)
#   2. ndk.abiFilters 'arm64-v8a' pins the build to the aarch64 ABI
#      (the app is pure Kotlin with no native code, so the APK is
#      architecture-independent and runs on all arm64 devices)
#   3. JVM target 17 for Java and Kotlin (upstream has an inconsistent
#      1.8 vs 17 target that fails the build)
#   4. Missing dependencies the source code needs: Room, WorkManager,
#      lifecycle-viewmodel-ktx
#   5. Two compile fixes in upstream code: LockStateManager uses the enum
#      DeviceLockState (not DeviceState), HomeworkRepository filters the
#      placeholder List<Any> returned by BakalariClient
#
# No Gradle wrapper is committed, so we run Gradle from the Docker image.

image: gradle:8.9-jdk17

variables:
  ANDROID_HOME: "$CI_PROJECT_DIR/.android-sdk"
  GRADLE_USER_HOME: "$CI_PROJECT_DIR/.gradle"
  GRADLE_OPTS: "-Dorg.gradle.daemon=false"
  SDK_PACKAGES: "platforms;android-34 build-tools;34.0.0 platform-tools"
  CMDLINE_TOOLS_URL: "https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip"

cache:
  key: ${CI_PROJECT_ID}
  paths:
    - .gradle/caches/
    - .android-sdk/

stages:
  - build

build:apk:
  stage: build
  before_script:
    - apt-get update -qq && apt-get install -y -qq --no-install-recommends curl unzip > /dev/null
    - mkdir -p "$ANDROID_HOME/cmdline-tools"
    - |
      if [ ! -d "$ANDROID_HOME/cmdline-tools/latest" ]; then
        curl -sSL -o /tmp/cmdtools.zip "$CMDLINE_TOOLS_URL"
        unzip -q /tmp/cmdtools.zip -d "$ANDROID_HOME/cmdline-tools"
        mv "$ANDROID_HOME/cmdline-tools/cmdline-tools" "$ANDROID_HOME/cmdline-tools/latest"
      fi
    - export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$PATH"
    - yes | sdkmanager --licenses > /dev/null || true
    - sdkmanager $SDK_PACKAGES > /dev/null
    # --- Patch 1 + 2: API 34 target and arm64-v8a ABI ---
    - sed -i 's/compileSdk 35/compileSdk 34/; s/targetSdk 35/targetSdk 34/; s/androidx.core:core-ktx:1.15.0/androidx.core:core-ktx:1.13.1/' app/build.gradle
    - sed -i "/targetSdk 34/a\\        ndk { abiFilters 'arm64-v8a' }" app/build.gradle
    # --- Patch 3 + 4: JVM 17 target and missing dependencies ---
    - |
      cat >> app/build.gradle <<'GRADLE'
      android {
          compileOptions {
              sourceCompatibility JavaVersion.VERSION_17
              targetCompatibility JavaVersion.VERSION_17
          }
      }
      kotlin {
          compilerOptions {
              jvmTarget.set(org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_17)
          }
      }
      dependencies {
          implementation 'androidx.room:room-runtime:2.6.1'
          implementation 'androidx.room:room-ktx:2.6.1'
          implementation 'androidx.work:work-runtime-ktx:2.9.1'
          implementation 'androidx.lifecycle:lifecycle-viewmodel-ktx:2.8.7'
      }
      GRADLE
    # --- Patch 5: upstream compile fixes ---
    - sed -i 's/^import cz.valleyman.bakalari.data.DeviceState$/import cz.valleyman.bakalari.data.DeviceLockState/; s/DeviceState/DeviceLockState/g' app/src/main/java/cz/valleyman/bakalari/child/LockStateManager.kt
    - sed -i 's/return client.getHomework()/return client.getHomework().filterIsInstance<Homework>()/' app/src/main/java/cz/valleyman/bakalari/data/HomeworkRepository.kt
  script:
    - gradle --no-daemon assembleDebug assembleRelease
  artifacts:
    name: "bakalari-api34-arm64-$CI_COMMIT_SHORT_SHA"
    paths:
      - app/build/outputs/apk/debug/*.apk
      - app/build/outputs/apk/release/*.apk
