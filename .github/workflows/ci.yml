name: CI

on:
  push:
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y jq shellcheck

      - name: Check Bash syntax
        run: bash -n bakalari-cli lib/common.sh modules/*.sh tests/*.sh

      - name: Run regression tests
        run: tests/run.sh

      - name: Run ShellCheck
        run: shellcheck --severity=error bakalari-cli lib/common.sh modules/*.sh tests/*.sh
